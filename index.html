<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Property Brochure | Team SRG</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000;
    --ink: #fff;
    --soft: #d4d4d4;
    --muted: #9a9a9a;
    --line: rgba(244, 122, 31, 0.22);   /* subtle orange hairlines */
    --edge: rgba(244, 122, 31, 0.45);   /* subtle orange button outlines */
    --lift: #161616;
    --orange: #f47a1f;
    --font: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--black); }
  body {
    margin: 0;
    background: var(--black);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  #page { max-width: 560px; margin: 0 auto; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

  /* Photo gallery */
  .gallery { position: relative; }
  .track {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .track::-webkit-scrollbar { display: none; }
  .slide {
    flex: 0 0 100%;
    aspect-ratio: 3 / 2;
    scroll-snap-align: start;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slide.missing { padding: 24px; }
  .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
  }
  .nav svg { width: 18px; height: 18px; }
  .nav.prev { left: 10px; }
  .nav.next { right: 10px; }
  .count {
    position: absolute;
    right: 10px;
    bottom: 10px;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.6);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }

  /* Headline block */
  .intro { padding: 24px 20px 0; }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 12px;
    font-size: 14px;
    color: var(--soft);
  }
  .status::before { content: ""; width: 8px; height: 8px; background: var(--orange); }
  h1 {
    margin: 0;
    font-size: clamp(24px, 6.4vw, 34px);
    font-weight: 900;
    line-height: 1.12;
    letter-spacing: -0.01em;
  }
  .area { margin: 10px 0 0; font-size: 16px; color: var(--soft); }
  .price { margin: 14px 0 0; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }

  /* Key numbers */
  .stats {
    display: grid;
    margin: 20px 20px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .stat { padding: 14px 0 14px 14px; border-left: 1px solid var(--line); }
  .stat:first-child { padding-left: 0; border-left: 0; }
  .stat b { display: block; font-size: 18px; font-weight: 700; }
  .stat span { font-size: 13px; color: var(--muted); }

  /* Buttons to files and links */
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 20px 20px 0;
  }
  .action {
    display: block;
    padding: 14px 14px 13px;
    border: 1px solid var(--edge);
    border-radius: 6px;
    text-decoration: none;
    transition: background 0.15s;
  }
  .action:hover, .action:active { background: var(--lift); }
  .action.wide { grid-column: 1 / -1; }
  .action strong { display: block; font-size: 15px; font-weight: 700; }
  .action span { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }
  .hint { margin: 0; padding: 10px 20px 0; font-size: 13px; color: var(--muted); }

  .open {
    margin: 24px 20px 0;
    padding: 14px 16px;
    border-left: 3px solid var(--orange);
    background: var(--lift);
  }
  .open strong { display: block; font-size: 15px; font-weight: 700; }
  .open span { font-size: 15px; color: var(--soft); }

  /* Content sections */
  .section { padding: 32px 20px 0; }
  h2 { margin: 0 0 12px; font-size: 18px; font-weight: 800; }
  .about p { margin: 0 0 14px; color: var(--soft); line-height: 1.65; }
  .details { margin: 0; }
  .details div {
    display: grid;
    grid-template-columns: minmax(110px, 38%) 1fr;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid var(--line);
    font-size: 15px;
  }
  .details div:last-child { border-bottom: 1px solid var(--line); }
  .details dt { color: var(--muted); }
  .details dd { margin: 0; color: var(--soft); }

  /* Agents */
  .agent { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .agent img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: #1a1a1a; }
  .agent-name { margin: 0; font-size: 16px; font-weight: 700; }
  .agent-title { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
  .agent-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 26px; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    border: 1px solid var(--edge);
    border-radius: 6px;
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
  }
  .btn:hover { background: var(--lift); }
  .btn.primary { background: var(--orange); border-color: var(--orange); color: #000; }

  footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    margin-top: 36px;
    padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px));
    border-top: 2px solid var(--orange);
  }
  footer img { display: block; flex: none; height: 42px; width: auto; max-width: 40%; }
  footer div { min-width: 0; }
  .brand { margin: 0; font-size: 14px; font-weight: 800; }
  .brokerage { margin: 3px 0 0; font-size: 13px; color: var(--soft); }
</style>
</head>
<body>
<div id="page">

  <div class="gallery" id="gallery" role="region" aria-label="Photo gallery">
    <div class="track" id="track" tabindex="0"></div>
    <button class="nav prev" id="prev" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="nav next" id="next" aria-label="Next photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <div class="count" id="count" aria-live="polite"></div>
  </div>

  <header class="intro">
    <p class="status" id="status"></p>
    <h1 id="address"></h1>
    <p class="area" id="area"></p>
    <p class="price" id="price"></p>
  </header>

  <div class="stats" id="stats"></div>

  <nav class="actions" id="actions" aria-label="Floor plan, feature sheet and links"></nav>
  <p class="hint" id="hint">The floor plan and feature sheet open as PDFs in a new tab, where you can save them to your phone.</p>

  <div class="open" id="open" hidden>
    <strong>Open house</strong>
    <span id="openText"></span>
  </div>

  <section class="section about" id="about">
    <h2>About the home</h2>
    <div id="desc"></div>
  </section>

  <section class="section" id="detailsSection">
    <h2>Details</h2>
    <dl class="details" id="details"></dl>
  </section>

  <section class="section" id="contact">
    <h2>Book a showing</h2>
    <div id="agents"></div>
  </section>

  <footer>
    <img src="logo.png" alt="Team SRG" onerror="this.hidden = true">
    <div>
      <p class="brand">Team SRG powered by RE/MAX</p>
      <p class="brokerage">RE/MAX City Realty (Fraser St)</p>
    </div>
  </footer>

</div>

<script>
/* ================================================================
   EDIT THIS SECTION FOR EACH LISTING
   Everything on the page comes from here. Change only the text
   inside the quotes. Leave a value as "" and that part of the
   page is hidden. Keep the comma at the end of each line.
   ================================================================ */
const LISTING = {
  status: "New Listing",                       // e.g. For sale, New listing, Sold
  address: "Unit 1 - 3873 W 22nd Avenue",
  type: "Duplex",                        // shows as "Townhouse in [area]"
  area: "Neighbourhood, Vancouver",
  price: "$2,250,000",
  beds: "3",
  baths: "4",
  sqft: "1,846",

  // Photos in this folder named 1.jpg, 2.jpg, 3.jpg and so on
  photoCount: 23,                            // how many photos, as a number with no quotes
  photoType: "jpg",                         // jpg or png

  // Buttons: a file name in this folder, or a full link starting with https://
  floorPlan: "floor-plan.pdf",
  featureSheet: "feature-sheet.pdf",
  videoTour: "https://youtu.be/GPbLMlEQ-DM",                            // YouTube, Vimeo or photographer link

  openHouse: "",                            // e.g. "Saturday, October 4, 2–4 PM"

  // Paste the description between the two backticks. Quotes and apostrophes are fine here.
  description: `Folding glass doors open the living room fully to the patio and fenced front yard, making the main floor of this brand new duplex a natural place to entertain. The kitchen and a powder room sit on the same level, with a full Miele appliance package, a 36-inch gas range, and a wine cooler. The bedrooms are on the floors above, away from the activity below. Every bedroom has an ensuite, the primary adds a walk-in closet, and the top floor bedroom has vaulted ceilings and a deck of its own. Heat pump heating and A/C, HRV, motorized blinds, a security system, and in-suite laundry are included. The detached garage off the rear lane includes a dedicated space for this unit, with 12-inch ceilings for overhead storage. In Dunbar, an established neighbourhood in Vancouver West, within the Lord Byng and Queen Elizabeth catchments, with French immersion at École Rose-des-Vents and École Jules-Verne. Pacific Spirit Park, Dunbar Community Centre, and UBC are close by.`,

  // Details: fill in what applies and leave the rest as ""
  details: {
    "MLS® number": "R3167088",
    "Year built": "2026",
    "Property taxes": "",
    "Parking": "Detached Garage, Single",
    "Heating and cooling": "Electric, Heat Pump, Air Conditioning",
    "Outdoor space": "Fenced Yard, Patio, Balcony",
    "School catchment": "Queen Elizabeth Elementary, Lord Byng Secondary, École Rose-des-Vents (French Immersion)",
    "Strata fee": "",
    "Pets and rentals": "",
    "Storage": "",
    "Amenities": "",
    "Lot size": "",
    "Zoning": "",
    "Suite": "",
    "Warranty": "",
  },

  // Agents on this listing. Delete a name if they're not on it.
  agents: ["dan", "bhupinder"],
};
/* ======================= END OF EDIT SECTION ======================= */


/* Agent details. These stay the same for every listing.
   Upload dan.jpg and bhupinder.jpg (400 x 400) with the listing photos. */
const AGENTS = {
  dan: {
    name: "Dan Toora",
    title: "Personal Real Estate Corporation",
    phone: "604-785-9772",
    email: "dantoora@remaxsrg.com",
    photo: "dan.jpg",
    text: true
  },
  bhupinder: {
    name: "Bhupinder Sodhi",
    title: "Personal Real Estate Corporation",
    phone: "604-379-2000",
    email: "bsodhi@remaxsrg.com",
    photo: "bhupinder.jpg",
    text: false   // office landline, so no Text button
  }
};


(function () {
  const L = LISTING;
  const $ = (id) => document.getElementById(id);
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text) node.textContent = text;
    return node;
  }
  function put(id, value) {
    const node = $(id);
    if (value) node.textContent = value; else node.hidden = true;
  }

  if (L.address) document.title = L.address + " | Team SRG";

  /* Headline */
  put("status", L.status);
  put("address", L.address);
  put("area", L.type && L.area ? L.type + " in " + L.area : (L.area || L.type));
  put("price", L.price);

  /* Photos: 1.jpg, 2.jpg, 3.jpg ... */
  const total = parseInt(L.photoCount, 10) || 0;
  const ext = String(L.photoType || "jpg").replace(/[^a-z]/gi, "") || "jpg";
  const track = $("track");
  for (let i = 1; i <= total; i++) {
    const src = i + "." + ext;
    const slide = el("div", "slide");
    const img = document.createElement("img");
    img.src = src;
    img.alt = (L.address || "Property") + ", photo " + i + " of " + total;
    img.loading = i <= 2 ? "eager" : "lazy";
    img.decoding = "async";
    img.onerror = function () {
      slide.classList.add("missing");
      slide.textContent = src + " was not found in this folder. Check the photo count and file names.";
    };
    slide.appendChild(img);
    track.appendChild(slide);
  }

  if (!total) {
    $("gallery").hidden = true;
  } else {
    const current = () => Math.round(track.scrollLeft / track.clientWidth);
    const showCount = () => { $("count").textContent = (current() + 1) + " / " + total; };
    const go = function (step) {
      let i = current() + step;
      if (i < 0) i = total - 1;
      if (i >= total) i = 0;
      track.scrollTo({ left: i * track.clientWidth, behavior: reduceMotion ? "auto" : "smooth" });
    };
    showCount();
    track.addEventListener("scroll", () => requestAnimationFrame(showCount), { passive: true });
    $("prev").addEventListener("click", () => go(-1));
    $("next").addEventListener("click", () => go(1));
    track.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
      if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
    });
    if (total < 2) { $("prev").hidden = true; $("next").hidden = true; $("count").hidden = true; }
  }

  /* Key numbers */
  const stats = [[L.beds, "Bedrooms"], [L.baths, "Bathrooms"], [L.sqft, "Sq ft"]].filter((s) => s[0]);
  const statsBox = $("stats");
  if (!stats.length) statsBox.hidden = true;
  statsBox.style.gridTemplateColumns = "repeat(" + stats.length + ", 1fr)";
  stats.forEach(function (s) {
    const cell = el("div", "stat");
    cell.append(el("b", "", s[0]), el("span", "", s[1]));
    statsBox.appendChild(cell);
  });

  /* Buttons. The gallery opens in the same window so the phone's back button returns here */
  const galleryLink = "gallery.html?count=" + total + "&type=" + ext +
    "&title=" + encodeURIComponent(L.address || "");
  const street = (L.address || "").split(/\s[-–]\s/).pop();   // drops "Unit 1 -" so Google Maps finds the building
  const mapQuery = [street, L.area, "BC"].filter(Boolean).join(", ");
  const links = [
    [L.floorPlan, "Floor plan", "HD PDF", "_blank"],
    [L.featureSheet, "Feature sheet", "PDF", "_blank"],
    [L.videoTour, "Video tour", "Opens in YouTube", "_blank"],
    [total ? galleryLink : "", "All photos", total === 1 ? "1 photo" : total + " photos", "_top"],
    [L.address ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(mapQuery) : "",
      "Map", "Opens in Google Maps", "_blank"]
  ].filter((a) => a[0]);
  const actions = $("actions");
  if (!links.length) actions.hidden = true;
  links.forEach(function (a, i) {
    const link = el("a", "action");
    link.href = a[0];
    link.target = a[3];
    if (a[3] === "_blank") link.rel = "noopener";
    link.appendChild(el("strong", "", a[1]));
    if (a[2]) link.appendChild(el("span", "", a[2]));
    if (i === links.length - 1 && links.length % 2 === 1) link.classList.add("wide");
    actions.appendChild(link);
  });
  if (!L.floorPlan && !L.featureSheet) $("hint").hidden = true;

  /* Open house */
  if (L.openHouse) { $("openText").textContent = L.openHouse; $("open").hidden = false; }

  /* Description */
  const desc = String(L.description || "").split(/\n\s*\n/)
    .map((p) => p.replace(/\s+/g, " ").trim()).filter(Boolean);
  if (!desc.length) $("about").hidden = true;
  desc.forEach((p) => $("desc").appendChild(el("p", "", p)));

  /* Details */
  const rows = Object.entries(L.details || {}).filter((r) => r[1] && String(r[1]).trim());
  if (!rows.length) $("detailsSection").hidden = true;
  rows.forEach(function (r) {
    const row = el("div");
    row.append(el("dt", "", r[0]), el("dd", "", String(r[1])));
    $("details").appendChild(row);
  });

  /* Agents. Phone, text and email links use _top so they work inside the MaxTech iframe */
  const agents = (L.agents || []).map((k) => AGENTS[String(k).trim().toLowerCase()]).filter(Boolean);
  if (!agents.length) $("contact").hidden = true;
  agents.forEach(function (a) {
    const box = el("div");
    const row = el("div", "agent");
    if (a.photo) {
      const img = document.createElement("img");
      img.src = a.photo;
      img.alt = a.name;
      img.onerror = () => img.remove();
      row.appendChild(img);
    }
    const who = el("div");
    who.appendChild(el("p", "agent-name", a.name));
    if (a.title) who.appendChild(el("p", "agent-title", a.title));
    row.appendChild(who);
    box.appendChild(row);

    const btns = el("div", "agent-btns");
    const digits = (a.phone || "").replace(/[^\d+]/g, "");
    const subject = encodeURIComponent("Inquiry: " + (L.address || "your listing"));
    [
      [digits && "tel:" + digits, "Call", "btn primary"],
      [a.text && digits && "sms:" + digits, "Text", "btn"],
      [a.email && "mailto:" + a.email + "?subject=" + subject, "Email", "btn"]
    ].forEach(function (b) {
      if (!b[0]) return;
      const link = el("a", b[2], b[1]);
      link.href = b[0];
      link.target = "_top";
      link.setAttribute("aria-label", b[1] + " " + a.name);
      btns.appendChild(link);
    });
    btns.style.gridTemplateColumns = "repeat(" + btns.children.length + ", 1fr)";
    box.appendChild(btns);
    $("agents").appendChild(box);
  });

  /* Tells the MaxTech page how tall this brochure is, so the iframe can fit it exactly */
  function sendHeight() {
    if (window.parent === window) return;
    const h = Math.ceil($("page").getBoundingClientRect().height);
    window.parent.postMessage({ type: "srg-brochure-height", height: h }, "*");
  }
  window.addEventListener("load", sendHeight);
  window.addEventListener("resize", sendHeight);
  if ("ResizeObserver" in window) new ResizeObserver(sendHeight).observe($("page"));
})();
</script>
</body>
</html>
