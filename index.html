<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Property Brochure | Team SRG</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000;
    --ink: #fff;
    --soft: #d4d4d4;
    --muted: #9a9a9a;
    --line: #2a2a2a;
    --edge: #3a3a3a;
    --lift: #161616;
    --orange: #f47a1f;
    --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--black); }
  body {
    margin: 0;
    background: var(--black);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  #page { max-width: 560px; margin: 0 auto; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

  /* Photo gallery */
  .gallery { position: relative; }
  .track {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .track::-webkit-scrollbar { display: none; }
  .slide {
    flex: 0 0 100%;
    aspect-ratio: 3 / 2;
    scroll-snap-align: start;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slide.missing { padding: 24px; }
  .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
  }
  .nav svg { width: 18px; height: 18px; }
  .nav.prev { left: 10px; }
  .nav.next { right: 10px; }
  .count {
    position: absolute;
    right: 10px;
    bottom: 10px;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.6);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }

  /* Headline block */
  .intro { padding: 24px 20px 0; }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 12px;
    font-size: 14px;
    color: var(--soft);
  }
  .status::before { content: ""; width: 8px; height: 8px; background: var(--orange); }
  h1 {
    margin: 0;
    font-stretch: 125%;
    font-weight: 600;
    font-size: clamp(26px, 7vw, 38px);
    line-height: 1.08;
    letter-spacing: -0.01em;
  }
  .area { margin: 10px 0 0; font-size: 16px; color: var(--soft); }
  .price { margin: 14px 0 0; font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; }

  /* Key numbers */
  .stats {
    display: grid;
    margin: 20px 20px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .stat { padding: 14px 0 14px 14px; border-left: 1px solid var(--line); }
  .stat:first-child { padding-left: 0; border-left: 0; }
  .stat b { display: block; font-size: 19px; font-weight: 600; }
  .stat span { font-size: 13px; color: var(--muted); }

  /* Buttons to files and links */
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 20px 20px 0;
  }
  .action {
    display: block;
    padding: 14px 14px 13px;
    border: 1px solid var(--edge);
    border-radius: 6px;
    text-decoration: none;
    transition: background 0.15s;
  }
  .action:hover, .action:active { background: var(--lift); }
  .action.wide { grid-column: 1 / -1; }
  .action strong { display: block; font-size: 16px; font-weight: 600; }
  .action span { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }
  .hint { margin: 0; padding: 10px 20px 0; font-size: 13px; color: var(--muted); }

  .open {
    margin: 24px 20px 0;
    padding: 14px 16px;
    border-left: 3px solid var(--orange);
    background: var(--lift);
  }
  .open strong { display: block; font-size: 15px; }
  .open span { font-size: 15px; color: var(--soft); }

  /* Content sections */
  .section { padding: 32px 20px 0; }
  h2 { margin: 0 0 12px; font-stretch: 112%; font-size: 18px; font-weight: 600; }
  .about p { margin: 0 0 14px; color: var(--soft); line-height: 1.65; }
  .features { list-style: none; margin: 0; padding: 0; }
  .features li { padding: 10px 0; border-top: 1px solid var(--line); color: var(--soft); }
  .features li:last-child { border-bottom: 1px solid var(--line); }

  /* Agents */
  .agent { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .agent img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: #1a1a1a; }
  .agent-name { margin: 0; font-size: 17px; font-weight: 600; }
  .agent-title { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
  .agent-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 26px; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    border: 1px solid var(--edge);
    border-radius: 6px;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
  }
  .btn:hover { background: var(--lift); }
  .btn.primary { background: var(--orange); border-color: var(--orange); color: #000; }

  footer {
    margin-top: 8px;
    padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
    background: var(--orange);
    color: #000;
  }
  footer img { display: block; height: 36px; margin-bottom: 12px; }
  .brand { margin: 0; font-stretch: 118%; font-size: 17px; font-weight: 700; }
  .brokerage { margin: 4px 0 0; font-size: 14px; }
  .legal { margin: 12px 0 0; font-size: 11.5px; line-height: 1.45; opacity: 0.8; }
</style>
</head>
<body>
<div id="page">

  <div class="gallery" id="gallery" role="region" aria-label="Photo gallery">
    <div class="track" id="track" tabindex="0"></div>
    <button class="nav prev" id="prev" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="nav next" id="next" aria-label="Next photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <div class="count" id="count" aria-live="polite"></div>
  </div>

  <header class="intro">
    <p class="status" id="status"></p>
    <h1 id="address"></h1>
    <p class="area" id="area"></p>
    <p class="price" id="price"></p>
  </header>

  <div class="stats" id="stats"></div>

  <nav class="actions" id="actions" aria-label="Floor plan, feature sheet and links"></nav>
  <p class="hint" id="hint">The floor plan and feature sheet open as PDFs in a new tab, where you can save them to your phone.</p>

  <div class="open" id="open" hidden>
    <strong>Open house</strong>
    <span id="openText"></span>
  </div>

  <section class="section about" id="about">
    <h2>About the home</h2>
    <div id="desc"></div>
  </section>

  <section class="section" id="highlightsSection">
    <h2>Highlights</h2>
    <ul class="features" id="highlights"></ul>
  </section>

  <section class="section" id="contact">
    <h2>Book a showing</h2>
    <div id="agents"></div>
  </section>

  <footer>
    <img id="logo" alt="Team SRG" hidden>
    <p class="brand" id="team"></p>
    <p class="brokerage" id="brokerage"></p>
    <p class="legal" id="legal"></p>
  </footer>

</div>

<script>
/* ================================================================
   EDIT THIS SECTION FOR EACH LISTING
   Everything on the page comes from here. Leave a value as ""
   (or an empty list [ ]) and that part of the page is hidden.
   Keep the quotes and the comma at the end of each line.
   ================================================================ */
const LISTING = {
  status: "For sale",                       // e.g. For sale, New listing, Sold
  address: "Unit 1, 3873 W 22nd Avenue",
  type: "Townhouse",                        // shows as "Townhouse in [area]"
  area: "Neighbourhood, Vancouver",
  price: "$0,000,000",
  beds: "0",
  baths: "0",
  sqft: "0,000",
  yearBuilt: "",

  // Photo files in this folder, in the order they should appear
  photos: [
    "photo-1.jpg",
    "photo-2.jpg",
    "photo-3.jpg",
    "photo-4.jpg",
    "photo-5.jpg",
    "photo-6.jpg"
  ],

  // Buttons: a file name in this folder, or a full link starting with https://
  floorPlan: "floor-plan.pdf",
  featureSheet: "feature-sheet.pdf",
  videoTour: "",                            // YouTube, Vimeo or photographer link
  allPhotos: "",                            // full gallery link from the photographer
  propertySite: "",

  openHouse: "",                            // e.g. "Saturday, October 4, 2–4 PM"

  description: [
    "First paragraph of the listing description goes here.",
    "Second paragraph. Add or remove paragraphs as needed, each in its own quotes."
  ],

  highlights: [
    "First highlight",
    "Second highlight",
    "Third highlight"
  ],

  agents: [
    { name: "Dan Toora",       title: "REALTOR®", phone: "604-000-0000", email: "name@example.com", photo: "" },
    { name: "Bhupinder Sodhi", title: "REALTOR®", phone: "604-000-0000", email: "name@example.com", photo: "" }
  ],

  team: "Team SRG powered by RE/MAX",
  brokerage: "RE/MAX City Realty",
  logo: "",                                 // optional, e.g. "logo.png"
  disclaimer: "Information is from sources believed reliable but is not guaranteed and should be independently verified. Not intended to solicit properties currently listed for sale."
};
/* ======================= END OF EDIT SECTION ======================= */


(function () {
  const L = LISTING;
  const $ = (id) => document.getElementById(id);
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text) node.textContent = text;
    return node;
  }
  function put(id, value) {
    const node = $(id);
    if (value) node.textContent = value; else node.hidden = true;
  }

  if (L.address) document.title = L.address + " | Team SRG";

  /* Headline */
  put("status", L.status);
  put("address", L.address);
  put("area", L.type && L.area ? L.type + " in " + L.area : (L.area || L.type));
  put("price", L.price);

  /* Gallery */
  const track = $("track");
  const photos = (L.photos || []).filter(Boolean);
  photos.forEach(function (src, i) {
    const slide = el("div", "slide");
    const img = document.createElement("img");
    img.src = src;
    img.alt = (L.address || "Property") + ", photo " + (i + 1) + " of " + photos.length;
    img.loading = i < 2 ? "eager" : "lazy";
    img.decoding = "async";
    img.onerror = function () {
      slide.classList.add("missing");
      slide.textContent = src + " was not found in this folder. Check the file name in the photos list.";
    };
    slide.appendChild(img);
    track.appendChild(slide);
  });

  if (!photos.length) {
    $("gallery").hidden = true;
  } else {
    const total = photos.length;
    const current = () => Math.round(track.scrollLeft / track.clientWidth);
    const showCount = () => { $("count").textContent = (current() + 1) + " / " + total; };
    const go = function (step) {
      let i = current() + step;
      if (i < 0) i = total - 1;
      if (i >= total) i = 0;
      track.scrollTo({ left: i * track.clientWidth, behavior: reduceMotion ? "auto" : "smooth" });
    };
    showCount();
    track.addEventListener("scroll", () => requestAnimationFrame(showCount), { passive: true });
    $("prev").addEventListener("click", () => go(-1));
    $("next").addEventListener("click", () => go(1));
    track.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
      if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
    });
    if (total < 2) { $("prev").hidden = true; $("next").hidden = true; $("count").hidden = true; }
  }

  /* Key numbers */
  const stats = [[L.beds, "Bedrooms"], [L.baths, "Bathrooms"], [L.sqft, "Sq ft"], [L.yearBuilt, "Built"]]
    .filter((s) => s[0]);
  const statsBox = $("stats");
  if (!stats.length) statsBox.hidden = true;
  statsBox.style.gridTemplateColumns = "repeat(" + stats.length + ", 1fr)";
  stats.forEach(function (s) {
    const cell = el("div", "stat");
    cell.append(el("b", "", s[0]), el("span", "", s[1]));
    statsBox.appendChild(cell);
  });

  /* Buttons */
  const links = [
    [L.floorPlan, "Floor plan", "HD PDF"],
    [L.featureSheet, "Feature sheet", "PDF"],
    [L.videoTour, "Video tour", ""],
    [L.allPhotos, "All photos", ""],
    [L.propertySite, "Property website", ""]
  ].filter((a) => a[0]);
  const actions = $("actions");
  if (!links.length) actions.hidden = true;
  links.forEach(function (a, i) {
    const link = el("a", "action");
    link.href = a[0];
    link.target = "_blank";
    link.rel = "noopener";
    link.appendChild(el("strong", "", a[1]));
    if (a[2]) link.appendChild(el("span", "", a[2]));
    if (i === links.length - 1 && links.length % 2 === 1) link.classList.add("wide");
    actions.appendChild(link);
  });
  if (!L.floorPlan && !L.featureSheet) $("hint").hidden = true;

  /* Open house */
  if (L.openHouse) { $("openText").textContent = L.openHouse; $("open").hidden = false; }

  /* Description and highlights */
  const desc = (L.description || []).filter(Boolean);
  if (!desc.length) $("about").hidden = true;
  desc.forEach((p) => $("desc").appendChild(el("p", "", p)));

  const highlights = (L.highlights || []).filter(Boolean);
  if (!highlights.length) $("highlightsSection").hidden = true;
  highlights.forEach((h) => $("highlights").appendChild(el("li", "", h)));

  /* Agents. Phone, text and email links use _top so they work inside the MaxTech iframe */
  const agents = (L.agents || []).filter((a) => a && a.name);
  if (!agents.length) $("contact").hidden = true;
  agents.forEach(function (a) {
    const box = el("div");
    const row = el("div", "agent");
    if (a.photo) {
      const img = document.createElement("img");
      img.src = a.photo;
      img.alt = a.name;
      row.appendChild(img);
    }
    const who = el("div");
    who.appendChild(el("p", "agent-name", a.name));
    if (a.title) who.appendChild(el("p", "agent-title", a.title));
    row.appendChild(who);
    box.appendChild(row);

    const btns = el("div", "agent-btns");
    const digits = (a.phone || "").replace(/[^\d+]/g, "");
    const subject = encodeURIComponent("Inquiry: " + (L.address || "your listing"));
    [
      [digits && "tel:" + digits, "Call", "btn primary"],
      [digits && "sms:" + digits, "Text", "btn"],
      [a.email && "mailto:" + a.email + "?subject=" + subject, "Email", "btn"]
    ].forEach(function (b) {
      if (!b[0]) return;
      const link = el("a", b[2], b[1]);
      link.href = b[0];
      link.target = "_top";
      link.setAttribute("aria-label", b[1] + " " + a.name);
      btns.appendChild(link);
    });
    btns.style.gridTemplateColumns = "repeat(" + btns.children.length + ", 1fr)";
    box.appendChild(btns);
    $("agents").appendChild(box);
  });

  /* Footer */
  if (L.logo) { $("logo").src = L.logo; $("logo").hidden = false; }
  put("team", L.team);
  put("brokerage", L.brokerage);
  put("legal", L.disclaimer);

  /* Tells the MaxTech page how tall this brochure is, so the iframe can fit it exactly */
  function sendHeight() {
    if (window.parent === window) return;
    const h = Math.ceil($("page").getBoundingClientRect().height);
    window.parent.postMessage({ type: "srg-brochure-height", height: h }, "*");
  }
  window.addEventListener("load", sendHeight);
  window.addEventListener("resize", sendHeight);
  if ("ResizeObserver" in window) new ResizeObserver(sendHeight).observe($("page"));
})();
</script>
</body>
</html>
